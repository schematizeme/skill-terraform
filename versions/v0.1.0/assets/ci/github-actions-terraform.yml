# CI de IaC (schematize-terraform). Copie para .github/workflows/terraform.yml.
# Fluxo: qualidade -> plan salvo como artefato (por ambiente) -> apply GATED só do plan aprovado.
# Pré-requisitos no GitHub (Settings > Environments):
#   - "hml-plan" e "prd-plan": secrets/OIDC SOMENTE-LEITURA (plan não escreve nada).
#   - "hml" e "prd": credencial de ESCRITA + "Required reviewers" (prd: 2 pessoas, sem auto-aprovação)
#     + "Deployment branches: main". É essa proteção que impede apply sem humano.
# Autenticação: OIDC (id-token: write), nunca chave estática. Ajuste o passo "Credencial".
# Ferramenta: OpenTofu por default. Para Terraform (ADR), troque o passo de setup por
# hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e (v4.0.1) e `tofu` por `terraform`.
name: terraform
on:
  pull_request:
    paths: ["envs/**", "modules/**", ".github/workflows/terraform.yml", ".tflint.hcl", "policy/**"]
  push:
    branches: [main]
    paths: ["envs/**", "modules/**"]
  workflow_dispatch:

concurrency:
  # Um pipeline por ambiente por vez; apply nunca é cancelado no meio (corrompe o state).
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TOFU_VERSION: "1.13.1" # igual ao required_version dos envs; suba em PR próprio
  CHECKOV_VERSION: "3.3.29"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: fmt
        run: tofu fmt -check -recursive -diff
      - name: validate (sem backend, sem credencial)
        run: |
          for d in envs/*/; do
            (cd "$d" && tofu init -backend=false -input=false >/dev/null && tofu validate)
          done
      - name: gate da casa (backend, pin, lock, segredo, state)
        # copie scripts/check-tf.sh da skill para tools/check-tf.sh do repo
        run: bash tools/check-tf.sh .
      - name: tflint
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"
      - name: checkov (segurança estática)
        run: |
          python3 -m pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d . --framework terraform --quiet --compact
      - name: tofu test (módulos)
        run: |
          for m in modules/*/; do
            if [ -d "$m/tests" ]; then (cd "$m" && tofu init -backend=false -input=false >/dev/null && tofu test); fi
          done

  plan:
    needs: qualidade
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [hml, prd]
    environment: ${{ matrix.env }}-plan
    permissions:
      contents: read
      id-token: write # OIDC
      pull-requests: write # comentário com o resumo do plan
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Credencial (OIDC, somente leitura)
        run: echo "troque por aws-actions/configure-aws-credentials (pinada por SHA) ou equivalente do seu cloud"
      - name: init
        run: tofu init -input=false
      - name: plan (salvo)
        run: tofu plan -input=false -lock-timeout=5m -var-file="${{ matrix.env }}.tfvars" -out=plano.tfplan -detailed-exitcode || [ $? -eq 2 ]
      - name: plan em JSON + política (conftest)
        run: |
          tofu show -json plano.tfplan > plano.json
          curl -fsSL -o /tmp/conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz"
          echo "c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  /tmp/conftest.tgz" | sha256sum -c -
          tar -xzf /tmp/conftest.tgz -C /tmp conftest
          /tmp/conftest test --policy ../../policy plano.json
      - name: plan legível no resumo do job (revisão humana)
        run: tofu show -no-color plano.tfplan >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # o plan pode conter segredo: retenção curta; com OpenTofu, use encryption.plan (enforced)
          name: plano-${{ matrix.env }}-${{ github.sha }}
          path: envs/${{ matrix.env }}/plano.tfplan
          retention-days: 7
          if-no-files-found: error

  apply-hml:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: plan
    runs-on: ubuntu-24.04
    environment: hml # proteção: branch main
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/hml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plano-hml-${{ github.sha }}
          path: envs/hml
      - name: Credencial (OIDC, escrita)
        run: echo "troque pelo seu cloud"
      - name: init
        run: tofu init -input=false
      - name: apply SOMENTE do plan salvo (se o state mudou, o plan é recusado como obsoleto)
        run: tofu apply -input=false -lock-timeout=5m plano.tfplan

  apply-prd:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: apply-hml # prd só depois de hml verde
    runs-on: ubuntu-24.04
    environment: prd # Required reviewers (2) + só a branch main: o gate humano
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: envs/prd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plano-prd-${{ github.sha }}
          path: envs/prd
      - name: Credencial (OIDC, escrita)
        run: echo "troque pelo seu cloud"
      - name: init
        run: tofu init -input=false
      - name: apply SOMENTE do plan aprovado
        run: tofu apply -input=false -lock-timeout=5m plano.tfplan
