# Drift detection agendada (schematize-terraform). Copie para .github/workflows/terraform-drift.yml.
# `plan -detailed-exitcode`: 0 = sem mudança · 2 = DRIFT (o mundo divergiu do código) · 1 = erro.
# Drift abre issue; o apply de correção segue o fluxo normal (PR + plan + aprovação).
name: terraform-drift
on:
  schedule:
    - cron: "17 6 * * *" # diário, fora da hora cheia
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        env: [hml, prd]
    environment: ${{ matrix.env }}-plan # credencial SOMENTE-LEITURA
    permissions:
      contents: read
      id-token: write
      issues: write
    defaults:
      run:
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.1"
          tofu_wrapper: false
      - name: Credencial (OIDC, somente leitura)
        run: echo "troque pelo seu cloud"
      - name: init
        run: tofu init -input=false
      - name: plan de drift
        id: plan
        run: |
          set +e
          tofu plan -input=false -lock=false -refresh=true -var-file="${{ matrix.env }}.tfvars" -detailed-exitcode -no-color > drift.txt
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: abre issue se houve drift
        if: steps.plan.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Drift em ${{ matrix.env }} ($(date -u +%F))" \
            --label drift \
            --body "O plan agendado de **${{ matrix.env }}** achou diferença entre o código e o mundo. Veja o log do job; corrija por PR (a mudança manual vira código ou é revertida pelo apply)."
      - name: falha se o plan deu erro
        if: steps.plan.outputs.code == '1'
        run: cat drift.txt; exit 1
